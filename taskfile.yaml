version: "3"

tasks:
  # Default task to list all available tasks
  default:
    desc: "List all available tasks"
    cmds:
      - task: list

  build:
    desc: "Produce a minimal Debian rootfs tarball for Helix"
    cmds:
      - sudo nix run --impure --accept-flake-config --no-write-lock-file --print-build-logs 'path:.#helix-debian-bootstrap' -- --output ./artifacts

  test:
    desc: "Sanity check the Debian rootfs tarball contents"
    cmds:
      - |
        set -euo pipefail
        latest=$(ls -1t artifacts/helix-debian-*.tar.gz 2>/dev/null | head -n1)
        if [ -z "$latest" ]; then
          echo "No Debian rootfs tarball found in artifacts/. Run task build-debian first." >&2
          exit 1
        fi
        tar -tzf "$latest" ./etc/os-release >/dev/null
        tar -tzf "$latest" ./etc/shadow >/dev/null
        tar -tzf "$latest" ./usr/sbin/sshd >/dev/null
        echo "Checked $latest: contains os-release, shadow, and sshd."

  clean:
    desc: "Clean up old build artifacts"
    cmds:
      - rm -rf artifacts result result-*
      - nix store gc
